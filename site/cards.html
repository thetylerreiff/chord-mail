<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chord cards</title>
<!-- The README banner and the link-preview image, drawn with the site's own type and inbox.
     dev/cards renders it: ?banner at 1200×400 (2x), ?og at 1200×630. Not part of the site build. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap">
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/light.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .card { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 0 40px; }
  .rail { height: 48px; }
  .rail .label { display: inline; }
  .stage { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 0 48px; align-items: center; padding: 0; }
  .side { gap: 18px; }
  .title { font-size: 50px; }
  .lede { font-size: 16px; max-width: 34ch; }
  .install code { font-size: 13px; }
  .fig { gap: 8px; }
  .inbox { --row-h: 44px; }
  .ib-acct { visibility: hidden; }
  .word { margin: 0 0 -1px; height: 156px; }
  .word .display { font-size: 271px; }

  /* The README banner is shorter: no lede, no install, and the inbox loses its last rows. */
  .banner .card { grid-template-rows: auto 1fr; }
  .banner .word, .banner .lede, .banner .install { display: none; }
  .banner .title { font-size: 52px; }
  .banner .stage { padding-block: 20px; }
  .banner .inbox { --row-h: 40px; }
  .banner .ib-row:nth-child(n + 5) { display: none; }
</style>
</head>
<body>
<div class="card">
  <header class="rail">
    <span class="label">Chord · keyboard-driven Gmail for Omarchy</span>
    <span class="label">chord.thetylerreiff.co</span>
  </header>
  <main class="stage">
    <div class="side">
      <h1 class="title">Mail at the speed of a keypress.</h1>
      <p class="lede">Every action is one key. The window reads a local cache, so it never waits on the network.</p>
      <div class="install">
        <p class="install-top label">Install · Arch / Omarchy</p>
        <code><span>curl -fsSL https://</span><span>chord.thetylerreiff.co/install | bash</span></code>
      </div>
    </div>
    <figure class="fig">
      <figcaption class="label"><span>Fig. 01 — The inbox, working</span><span>j k e h # z</span></figcaption>
      <div class="inbox" id="inbox"></div>
    </figure>
  </main>
  <div class="word" aria-hidden="true"><span class="display">Chord</span></div>
</div>
<script type="module">
  import { mountInbox } from '/src/inbox.js';
  document.body.classList.toggle('banner', location.search.includes('banner'));
  mountInbox(document.getElementById('inbox'));
</script>
</body>
</html>
