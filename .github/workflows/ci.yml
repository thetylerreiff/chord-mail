name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Chord targets Omarchy, so it builds against Arch's current Qt and Rust.
    container: archlinux:latest
    env:
      CARGO_TERM_COLOR: always
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install build dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel git lld rust
          qt6-base qt6-declarative qt6-webengine qt6-wayland

      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
